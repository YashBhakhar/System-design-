name: Deploy to GitHub Pages

# Builds the site and publishes it on every push to main.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check concept data
        run: npm run check-data
      - name: Check Ask AI logic
        run: npm run check-ai
      - name: Build
        run: npm run build
        env:
          # The Ask AI Worker's URL: a repository variable (not a secret; it's public).
          # Settings → Secrets and variables → Actions → Variables. Unset: the Ask tab says the AI is off.
          VITE_AI_URL: ${{ vars.VITE_AI_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
